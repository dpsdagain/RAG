# ──────────────────────────────────────────────────────────────────────────────
# RAG System – Master Configuration
#
# Every key here can be overridden via environment variables using the RAG_
# prefix and double-underscore for nesting.
#   e.g.  RAG_LLM__MODEL=llama3.1  overrides  llm.model
# ──────────────────────────────────────────────────────────────────────────────

# ── Persistent storage ──
database:
  db_path: "./data/rag.db"

# ── Embedding model ──
# provider=voyage uses Voyage AI's voyage-code-3 (cloud), tuned for code AND
# documentation retrieval — the best fit for a codebase+document corpus.
# Set RAG_EMBEDDING__API_KEY in .env (never commit the key).
# Switch provider back to "onnx" to use the local bge-small (dim 384, offline,
# no key). NOTE: changing provider/dim requires a fresh DB + re-ingest.
embedding:
  provider: "voyage"                  # voyage (cloud voyage-code-3) | onnx (local bge-small)
  model_path: "voyage-code-3"         # Voyage model name when provider=voyage
  dim: 1024                           # voyage-code-3 Matryoshka dims: 256/512/1024/2048
  onnx_threads: 4
  batch_size: 64
  api_key: ""                         # REDACTED: set RAG_EMBEDDING__API_KEY in .env

# ── LLM provider ──
llm:
  provider: "openai"                  # mapped to openai to utilize token authentication
  base_url: "https://ollama.com/v1"
  model: "gpt-oss:120b-cloud"
  api_key: ""                         # REDACTED: DO NOT COMMIT API KEYS
  temperature: 0.1
  max_tokens: 2048
  timeout_seconds: 60

# ── LlamaParse cloud parsing (optional) ──
llamaparse:
  api_key: ""

# ── Cloud VLM for image-heavy documents (optional) ──
cloud_vlm:
  provider: "gemini"                  # gemini | openai
  api_key: ""

# ── Retrieval pipeline ──
retrieval:
  dense_top_k: 50
  sparse_top_k: 50
  rrf_k: 60
  rrf_top_n: 100
  rerank_top_k: 15
  context_budget_tokens: 12000
  # rerank-2.5: Voyage AI cloud reranker, strong on code AND prose. Uses the
  # same Voyage key as the embedder (RAG_EMBEDDING__API_KEY) and runs in the
  # cloud, so it sidesteps the heavy local CPU cost of cross-encoders
  # (bge-reranker-v2-m3 took ~5min/query on this CPU). Auto-routes to the
  # Voyage backend in reranker.py; falls back to local FlashRank ms-marco if no
  # key. Set to 'ms-marco-MiniLM-L-12-v2' to force the local reranker.
  rerank_model: "rerank-2.5"

# ── Advanced pipeline features ──
# CRAG is disabled by default — it adds one cloud LLM call per query and
# largely returns SUFFICIENT in practice. Faithfulness is kept because it
# actually catches ungrounded claims. Re-enable CRAG if you want stricter
# retrieval-quality gating at the cost of extra latency + tokens.
pipeline:
  crag_enabled: false
  decomposition_enabled: true
  faithfulness_check_enabled: true
  # Agentic ReAct retrieval: the LLM drives an iterative search/read loop
  # instead of one-shot retrieve+decompose. Better for multi-hop and code
  # questions (e.g. "where is X used and what calls it?"). Costs one extra
  # cheap cloud LLM call per iteration — no new local model, so it is NOT
  # hardware-bound. Off by default; flip to true to enable.
  agentic_enabled: false
  agentic_max_iterations: 5

# ── Memory subsystem ──
memory:
  working_memory_max_turns: 10
  episodic_memory_top_k: 3

# ── Semantic cache ──
# Threshold lowered from 0.95 → 0.85: at 0.95 the real-world hit rate was
# effectively 0% because near-paraphrases of the same question rarely
# cosine-match that closely. 0.85 still requires strong semantic overlap.
cache:
  max_entries: 500
  similarity_threshold: 0.85
  ttl_seconds: 3600

# ── Chunking strategy ──
chunking:
  max_chunk_tokens: 512
  min_chunk_tokens: 50
  semantic_threshold: 0.3

# ── HTTP server ──
server:
  host: "0.0.0.0"
  port: 8000
  api_key: "change-me-in-production"

# ── Observability ──
observability:
  log_level: "INFO"
  log_file: "./logs/rag.log"

# ── Document ingestion ──
ingestion:
  watch_directory: ""                 # leave empty to disable directory watcher
  batch_size: 32
  max_file_size_mb: 100
