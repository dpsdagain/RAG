[pytest]
testpaths = unit integration e2e quality
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
markers =
    requires_db: needs sqlite-vec compiled and loadable
    requires_embedder: needs the real ONNX bge-small model on disk
    requires_llm: needs RAG_LLM__API_KEY env var pointing at a real LLM
    slow: takes more than a couple of seconds
filterwarnings =
    ignore::DeprecationWarning
